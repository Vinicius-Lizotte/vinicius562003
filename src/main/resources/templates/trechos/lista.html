<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Trechos')}"></head>
<body>
<header th:replace="~{fragments :: topo}"></header>

<main class="conteudo">
    <div class="titulo-pagina">
        <h1>Trechos <small>ordenados por altitude, depois logradouro</small></h1>
        <a class="botao" th:href="@{/trechos/novo}">+ Novo trecho</a>
    </div>

    <div th:replace="~{fragments :: mensagens}"></div>

    <table class="tabela">
        <thead>
        <tr>
            <th>Logradouro</th>
            <th>Bairro</th>
            <th>Tipo de calçada</th>
            <th>Altitude (m)</th>
            <th class="acoes">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(trechos)}">
            <td colspan="5" class="vazio">Nenhum trecho cadastrado.</td>
        </tr>
        <tr th:each="t : ${trechos}">
            <td th:text="${t.logradouro}">Rua Alta</td>
            <td th:text="${t.bairroNome}">Vila Esperança</td>
            <td th:text="${t.tipoCalcada}">Regular</td>
            <td th:text="${t.altitude}">755</td>
            <td class="acoes">
                <a class="botao botao-sec" th:href="@{/trechos/{id}/editar(id=${t.id})}">Editar</a>
                <form th:action="@{/trechos/{id}/excluir(id=${t.id})}" method="post"
                      onsubmit="return confirm('Excluir este trecho? As leituras dele também serão excluídas.');">
                    <button type="submit" class="botao botao-perigo">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments :: rodape}"></footer>
</body>
</html>
